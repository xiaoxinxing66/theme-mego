<header>
    <style>
        /* 玻璃拟态 */
        .glass-effect {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* 移动端菜单动画 */
        #mobile-menu {
            transition: transform 0.3s ease-in-out, opacity 0.3s ease-in-out;
        }
        #mobile-menu.hidden-menu {
            transform: translateY(-20px);
            opacity: 0;
            pointer-events: none;
        }
        #mobile-menu.visible-menu {
            transform: translateY(0);
            opacity: 1;
            pointer-events: auto;
        }

        /* 下拉菜单样式 */
        .dropdown-menu {
            position: absolute;
            top: 100%;
            right: 0;
            width: 200px;
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 8px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(10px);
            transition: all 0.2s ease-in-out;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .dropdown-group:hover .dropdown-menu {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        .dropdown-item {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            color: #cbd5e1;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .dropdown-item:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }
    </style>

    <!-- 导航栏 (Fixed) -->
    <nav class="w-full py-6 px-6 md:px-12 flex justify-between items-center glass-effect fixed top-0 z-50 transition-all duration-300" id="navbar">
        <div class="flex items-center gap-3">
            <th:block th:with="customLogo=${theme.config.index_info.custom.custom_logo}, defaultLogo=${theme.config.index_info.default.logo ?: site.logo}">
                <img th:if="${not #strings.isEmpty(customLogo)}" th:src="${customLogo}" alt="Logo" class="w-10 h-10 rounded-lg object-cover shadow-lg shadow-blue-500/30">
                <img th:if="${#strings.isEmpty(customLogo) and not #strings.isEmpty(defaultLogo)}" th:src="${defaultLogo}" alt="Logo" class="w-10 h-10 rounded-lg object-cover shadow-lg shadow-blue-500/30">
                <div th:if="${#strings.isEmpty(customLogo) and #strings.isEmpty(defaultLogo)}" class="w-10 h-10 rounded-lg bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-blue-500/30">
                    <i class="fas fa-robot"></i>
                </div>
            </th:block>
            <span class="text-xl font-bold tracking-tight text-white hidden md:block">Sivan's AI Space</span>
            <span class="text-lg font-bold tracking-tight text-white md:hidden">Sivan's AI Space</span>
        </div>

        <!-- PC 菜单 -->
        <div class="hidden md:flex space-x-8 text-sm font-medium text-gray-400 items-center">
            <a href="/" class="hover:text-white transition-colors">首页</a>
            <a href="/archives" class="hover:text-white transition-colors">文章全览</a>
            <a href="https://blog.csdn.net/weixin_62633072" target="_blank" class="hover:text-white transition-colors flex items-center gap-1">
                技术博客 <i class="fas fa-external-link-alt text-xs"></i>
            </a>

            <!-- AI 工具箱下拉菜单 -->
            <div class="relative dropdown-group py-2">
                <button class="flex items-center gap-1 text-blue-400 hover:text-blue-300 transition-colors focus:outline-none">
                    AI 工具箱 <i class="fas fa-chevron-down text-xs"></i>
                </button>
                <div class="dropdown-menu">
                    <a href="https://chat.openai.com/" target="_blank" class="dropdown-item">
                        <i class="fas fa-robot w-6" style="color: #4ade80;"></i> ChatGPT
                    </a>
                    <a href="https://claude.ai/" target="_blank" class="dropdown-item">
                        <i class="fas fa-brain w-6" style="color: #fb923c;"></i> Claude
                    </a>
                    <a href="https://kimi.moonshot.cn/" target="_blank" class="dropdown-item">
                        <i class="fas fa-moon w-6" style="color: #60a5fa;"></i> Kimi
                    </a>
                    <a href="https://www.doubao.com/" target="_blank" class="dropdown-item">
                        <i class="fas fa-comment-dots w-6" style="color: #c084fc;"></i> 豆包
                    </a>
                    <a href="https://yiyan.baidu.com/" target="_blank" class="dropdown-item">
                        <i class="fas fa-dragon w-6" style="color: #3b82f6;"></i> 文心一言
                    </a>
                    <a href="https://tongyi.aliyun.com/" target="_blank" class="dropdown-item">
                        <i class="fas fa-cloud w-6" style="color: #818cf8;"></i> 通义千问
                    </a>
                    <a href="https://www.midjourney.com/" target="_blank" class="dropdown-item">
                        <i class="fas fa-paint-brush w-6" style="color: #f472b6;"></i> Midjourney
                    </a>
                </div>
            </div>
        </div>

        <!-- 移动端菜单按钮 -->
        <button id="mobile-menu-btn" class="md:hidden text-gray-300 hover:text-white focus:outline-none">
            <i class="fas fa-bars text-2xl"></i>
        </button>
    </nav>

    <!-- 移动端下拉菜单 -->
    <div id="mobile-menu" class="fixed top-[88px] left-0 w-full glass-effect border-t border-gray-700/50 z-40 hidden-menu md:hidden">
        <div class="flex flex-col p-6 space-y-4 text-center">
            <a href="/" class="text-gray-300 hover:text-white py-2 border-b border-gray-700/30">首页</a>
            <a href="/archives" class="text-gray-300 hover:text-white py-2 border-b border-gray-700/30">文章全览</a>
            <a href="https://blog.csdn.net/weixin_62633072" target="_blank" class="text-gray-300 hover:text-white py-2 border-b border-gray-700/30">
                技术博客 (CSDN) <i class="fas fa-external-link-alt text-xs ml-1"></i>
            </a>

            <!-- 移动端 AI 工具箱 (折叠式) -->
            <div class="py-2">
                <div class="text-blue-400 font-bold mb-3">AI 工具箱</div>
                <div class="grid grid-cols-2 gap-3">
                    <a href="https://chat.openai.com/" target="_blank" class="bg-white/5 p-2 rounded-lg text-sm text-gray-300 flex items-center gap-2">
                        <i class="fas fa-robot" style="color: #4ade80;"></i> ChatGPT
                    </a>
                    <a href="https://claude.ai/" target="_blank" class="bg-white/5 p-2 rounded-lg text-sm text-gray-300 flex items-center gap-2">
                        <i class="fas fa-brain" style="color: #fb923c;"></i> Claude
                    </a>
                    <a href="https://kimi.moonshot.cn/" target="_blank" class="bg-white/5 p-2 rounded-lg text-sm text-gray-300 flex items-center gap-2">
                        <i class="fas fa-moon" style="color: #60a5fa;"></i> Kimi
                    </a>
                    <a href="https://www.doubao.com/" target="_blank" class="bg-white/5 p-2 rounded-lg text-sm text-gray-300 flex items-center gap-2">
                        <i class="fas fa-comment-dots" style="color: #c084fc;"></i> 豆包
                    </a>
                    <a href="https://yiyan.baidu.com/" target="_blank" class="bg-white/5 p-2 rounded-lg text-sm text-gray-300 flex items-center gap-2">
                        <i class="fas fa-dragon" style="color: #3b82f6;"></i> 文心一言
                    </a>
                    <a href="https://tongyi.aliyun.com/" target="_blank" class="bg-white/5 p-2 rounded-lg text-sm text-gray-300 flex items-center gap-2">
                        <i class="fas fa-cloud" style="color: #818cf8;"></i> 通义千问
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 移动端菜单控制
        (function() {
            const mobileMenuBtn = document.getElementById('mobile-menu-btn');
            const mobileMenu = document.getElementById('mobile-menu');

            if (mobileMenuBtn && mobileMenu) {
                const mobileIcon = mobileMenuBtn.querySelector('i');

                function toggleMobileMenu() {
                    const isHidden = mobileMenu.classList.contains('hidden-menu');
                    if (isHidden) {
                        mobileMenu.classList.remove('hidden-menu');
                        mobileMenu.classList.add('visible-menu');
                        if (mobileIcon) {
                            mobileIcon.classList.remove('fa-bars');
                            mobileIcon.classList.add('fa-times');
                        }
                    } else {
                        mobileMenu.classList.add('hidden-menu');
                        mobileMenu.classList.remove('visible-menu');
                        if (mobileIcon) {
                            mobileIcon.classList.add('fa-bars');
                            mobileIcon.classList.remove('fa-times');
                        }
                    }
                }

                mobileMenuBtn.addEventListener('click', toggleMobileMenu);
            }
        })();
    </script>
</header>
